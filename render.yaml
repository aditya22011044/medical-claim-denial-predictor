services:
  - type: web
    name: medical-claim-denial-predictor
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: LLM_MODEL
        value: gpt-4o-mini
      # Optional: paste an OpenAI-compatible key during setup to enable LLM
      # recommendations. Leave empty to use the built-in offline advisor.
      - key: OPENAI_API_KEY_1
        sync: false
